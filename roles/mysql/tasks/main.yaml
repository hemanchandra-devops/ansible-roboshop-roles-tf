- name: install mysql
  ansible.builtin.dnf:
    name: mysql-server
    state: present

- name: start, enable mysql
  ansible.builtin.service:
    name: mysqld 
    state: started
    enabled: yes

- name: Install boto3 and botocore
  ansible.builtin.pip:
    name:
      - boto3
      - botocore
    executable: pip3.9
    state: present

- name: Set MySQL root password
  ansible.builtin.command: mysql_secure_installation --set-root-pass {{ MYSQL_ROOT_PASSWORD }}